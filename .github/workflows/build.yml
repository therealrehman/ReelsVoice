name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Vosk native libs (0.3.45)
        run: |
          curl -fL -o vosk.zip https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-android-0.3.45.zip
          mkdir -p app/src/main/jniLibs
          unzip -oq vosk.zip -d app/src/main/jniLibs
          rm -f app/src/main/jniLibs/vosk_api.h vosk.zip
          ls -R app/src/main/jniLibs

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsVoice-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
